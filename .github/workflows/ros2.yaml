on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # rolling: the APIs of the next distributions (e.g. image_transport and tf2_ros taking the node interfaces)
        ROS_DISTRO: [jazzy, rolling]
    name: build_and_test (${{ matrix.ROS_DISTRO }})
    steps:
      - uses: actions/checkout@v4
      - uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: ${{ matrix.ROS_DISTRO }}
          # rosdep's `pip:` installer refuses to install globally on
          # Python >= 3.11 (PEP 668) unless explicitly told to.
          PIP_BREAK_SYSTEM_PACKAGES: '1'
